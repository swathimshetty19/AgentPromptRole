config_version: 1.0
experiment_name: "exp4_toolagent"

models:
  - "qwen/qwen-turbo"
  # You can add more models, or change here if needed

dataset:
  loader: "json_schema"
  path: "./datasets/adherence/toolbench_tool_with_prior.jsonl"
  # limit: 250  # Using full dataset (1100 samples)

  # input columns to the builder, in order
  builder_inputs:
    - query_text
    - api_schema_definition

  # input columns to the validator, in order (the LLM output will be the first input)
  validator_inputs:
    - api_schema_definition

builders:
  - "system_plus_user_assistant_seed"

validator: "agentic_tool_validator"